<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Football Legends</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07120d;color:#fff;font-family:Inter,Arial,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(430px,78vw);height:76px}.scorebar{height:54px;border-radius:12px;background:linear-gradient(90deg,#1270d8 0 34%,#eef4ef 34% 66%,#b51e32 66%);box-shadow:0 8px 30px #0008;display:grid;grid-template-columns:1fr 86px 1fr;align-items:center;overflow:hidden;border:2px solid #ffffff18}.team{height:100%;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:900}.team.right{justify-content:flex-end}.crest{width:34px;height:34px;border-radius:50%;background:#fff1;border:2px solid #fff8;display:grid;place-items:center;font-size:16px}.score{height:100%;background:#111820e8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:1000;letter-spacing:5px}.time{text-align:center;margin-top:7px;font-size:12px;font-weight:900;color:#dfe9dd}.energy{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:260px;text-align:center}.energy .label{font-size:11px;font-weight:900;letter-spacing:2px}.meter{margin-top:6px;height:8px;border-radius:10px;background:#08130eb0;border:1px solid #fff4;overflow:hidden}.fill{width:100%;height:100%;background:linear-gradient(90,#7efc91,#e9ff65)}#start,#pause,#goal{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(120deg,#07150fdd,#0d2418bb);pointer-events:auto}.card{width:min(520px,calc(100vw - 36px));border:1px solid #ffffff22;border-radius:24px;padding:28px;text-align:center;background:#07130dc7;box-shadow:0 30px 100px #000b}.eyebrow{color:#9bea75;font-size:12px;font-weight:900;letter-spacing:4px}.card h1{font-size:clamp(38px,8vw,72px);line-height:.9;margin:14px 0 10px;text-transform:uppercase;letter-spacing:-4px}.card h1 em{font-style:normal;color:#c8ef63}.card p{color:#bdc9c1;line-height:1.6}.btn{border:0;border-radius:12px;padding:16px 28px;background:#d3ed63;color:#102012;font-weight:1000;font-size:14px;cursor:pointer}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}.key{border:1px solid #fff2;border-radius:8px;padding:8px 10px;font-size:11px;background:#ffffff08}.hidden{display:none!important}#goal{background:transparent;pointer-events:none}.goaltext{font-size:clamp(48px,12vw,100px);font-weight:1000;font-style:italic;text-shadow:0 12px 40px #000;transform:rotate(-4deg);animation:pulse .7s ease}.goaltext span{color:#dbff65}@keyframes pulse{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}#joystick{position:fixed;left:24px;bottom:48px;width:120px;height:120px;border:2px solid #ffffff28;border-radius:50%;display:none;pointer-events:auto;background:#ffffff08}.stick{position:absolute;width:52px;height:52px;border-radius:50%;left:34px;top:34px;background:#ffffff38;border:2px solid #fff7}.touchactions{position:fixed;right:24px;bottom:40px;width:170px;height:150px;display:none;pointer-events:auto}.action{position:absolute;border-radius:50%;border:2px solid #ffffff50;color:#fff;font-weight:1000;background:#102017aa}.shoot{width:82px;height:82px;right:0;bottom:0;background:#d3ed63cc;color:#102012}.pass{width:62px;height:62px;left:18px;bottom:6px}.switch{width:54px;height:54px;right:2px;top:-10px}.radar{position:absolute;right:18px;bottom:18px;width:112px;height:64px;border-radius:8px;border:2px solid #fff3;background:#1a654370}.radar i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff}.radar i.a{background:#55aaff}.radar i.b{background:#ff6677}@media(max-width:900px),(pointer:coarse){#joystick,.touchactions{display:block}.radar{display:none}.energy{bottom:18px}.top{top:8px}.team{font-size:12px}.score{font-size:20px}.controls{display:none}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="scorebar"><div class="team"><div class="crest">⚡</div><span>ULTRA</span></div><div class="score"><span id="s1">0</span><span>:</span><span id="s2">0</span></div><div class="team right"><span>ROYAL</span><div class="crest">♛</div></div></div><div class="time" id="clock">00:00</div></div><div class="energy"><div class="label">STAMINA</div><div class="meter"><div class="fill" id="stamina"></div></div></div><div class="radar" id="radar"></div></div>
<div id="start"><div class="card"><div class="eyebrow">NEON PARK SERIES</div><h1>Football <em>Legends</em></h1><p>Lead Ultra FC against Royal XI.<br>Fast-paced 3D football action.</p><div class="controls"><span class="key">WASD MOVE</span><span class="key">X SHOOT</span><span class="key">C PASS</span><span class="key">V SWITCH</span></div><button class="btn" id="play">KICK OFF</button></div></div><div id="pause" class="hidden"><div class="card"><div class="eyebrow">MATCH PAUSED</div><h1>Half <em>Time</em></h1><button class="btn" id="resume">RESUME</button></div></div><div id="goal" class="hidden"><div class="goaltext">GO<span>AL!</span></div></div><div id="joystick"><div class="stick" id="stick"></div></div><div class="touchactions"><button class="action switch" id="btnSwitch">SW</button><button class="action pass" id="btnPass">PASS</button><button class="action shoot" id="btnShoot">SHOOT</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const pitch={w:70,h:44},players=[];let ball={x:0,z:0,vx:0,vz:0,r:.55},controlled=0,score=[0,0],running=false,paused=false,matchT=0,stamina=100,last=performance.now(),goalTimer=0,lastTeam=0,touchMove=null;
const names=['MBAPPÉ','HAALAND','VINICIUS','BELLINGHAM','PEDRI','MESSI','RONALDO','NEYMAR','MODRIC','DE BRUYNE'];
function makePlayers(){for(let i=0;i<10;i++){let team=i<5?0:1,row=i%5,x=team===0?-26+row*13:26-row*13,z=(row%3-1)*9;players.push({x,z,team,num:i%5+7,name:names[i],color:team===0?'#1878d8':'#b72a3e',angle:0,hasBall:false})}}makePlayers();
function resetKickoff(team=0){ball.x=0;ball.z=0;ball.vx=0;ball.vz=0;players.forEach((p,i)=>{p.x=(p.team===0?-24:24)+((i%5)-2)*7;p.z=((i%5)%3-1)*7;p.hasBall=false});controlled=team===0?0:5}
function nearestBall(team){let list=players.filter(p=>p.team===team),n=list[0],bd=1e9;for(let p of list){let d=Math.hypot(p.x-ball.x,p.z-ball.z);if(d<bd){bd=d;n=p}}return players.indexOf(n)}
function update(dt){if(!running||paused)return;matchT=Math.min(300,matchT+dt);let keysDown=window.keys||{};let mx=(keysDown.d||keysDown.arrowright?1:0)-(keysDown.a||keysDown.arrowleft?1:0),mz=(keysDown.s||keysDown.arrowdown?1:0)-(keysDown.w||keysDown.arrowup?1:0);if(touchMove){mx=touchMove.x;mz=touchMove.y}let p=players[controlled];p.x+=mx*14*dt;p.z+=mz*14*dt;p.x=Math.max(-34,Math.min(34,p.x));p.z=Math.max(-21,Math.min(21,p.z));stamina=Math.max(0,stamina-(Math.abs(mx)+Math.abs(mz)>0?18:0)*dt);if(stamina<100&&Math.abs(mx)+Math.abs(mz)<.1)stamina=Math.min(100,stamina+12*dt);
for(let i=0;i<players.length;i++){let a=players[i];if(i===controlled&&a.team===0)continue;let target;let n=nearestBall(a.team);if(i===n){target={x:ball.x,z:ball.z}}else target={x:a.team===0?-8:a.x*.05,z:a.team===0?a.z:0};let dx=target.x-a.x,dz=target.z-a.z,l=Math.hypot(dx,dz)||1;if(i===n||l<32){a.x+=dx/l*7*dt;a.z+=dz/l*7*dt;a.angle=Math.atan2(dz,dx)}}
ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;ball.vx*=Math.pow(.985,dt*60);ball.vz*=Math.pow(.985,dt*60);if(Math.abs(ball.z)>pitch.h/2-.3){ball.z=Math.sign(ball.z)*(pitch.h/2-.3);ball.vz*=-.55}if(Math.abs(ball.x)>pitch.w/2-.3){if(Math.abs(ball.z)<8.2)scoreGoal(ball.x>0?0:1);else{ball.x=Math.sign(ball.x)*(pitch.w/2-.3);ball.vx*=-.55}}let nearest=null,best=99;for(let q of players){let d=Math.hypot(q.x-ball.x,q.z-ball.z);if(d<best){best=d;nearest=q}}if(nearest&&best<1.35){ball.vx*=.35;ball.vz*=.35;ball.x=nearest.x+(nearest===p&&mx!==0?mx*.9:0);ball.z=nearest.z+(nearest===p&&mz!==0?mz*.7:.7)}if(goalTimer>0){goalTimer-=dt;if(goalTimer<=0)resetKickoff(lastTeam)}updateHud()}
function scoreGoal(team){if(goalTimer>0)return;score[team]++;goalTimer=2.6;lastTeam=team;document.getElementById('s1').textContent=score[0];document.getElementById('s2').textContent=score[1];document.getElementById('goal').classList.remove('hidden');setTimeout(()=>document.getElementById('goal').classList.add('hidden'),1900)}
function shoot(){let p=players[controlled];ball.vx=-p.x*1.05+(p.team===0?12:0);ball.vz=-p.z*1.05+(ball.z<0?-2:2)}
function passBall(){let p=players[controlled],mates=players.filter(a=>a.team===0&&a!==p);mates.sort((a,b)=>Math.hypot(a.x-p.x,a.z-p.z)-Math.hypot(b.x-p.x,b.z-p.z));let q=mates[0];if(q){ball.vx=(q.x-p.x)*3.2;ball.vz=(q.z-p.z)*3.2}}
function switchPlayer(){controlled=nearestBall(0)}
function updateHud(){document.getElementById('stamina').style.width=stamina+'%';let m=Math.floor(matchT/60),s=Math.floor(matchT%60);document.getElementById('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');let radar=document.getElementById('radar');radar.innerHTML='';for(let p of players){let d=document.createElement('i');d.className=p.team?'b':'a';d.style.left=(50+p.x/pitch.w*100)+'%';d.style.top=(50+p.z/pitch.h*100)+'%';radar.appendChild(d)}let d=document.createElement('i');d.style.background='#dbff65';d.style.left=(50+ball.x/pitch.w*100)+'%';d.style.top=(50+ball.z/pitch.h*100)+'%';radar.appendChild(d)}
function project(x,z,y=0){let cam={x:0,z:-58,y:35},rx=x-cam.x,rzz=z-cam.z,ry=y-cam.y,pa=-.42,cz=Math.cos(pa),sz=Math.sin(pa),yy=ry*cz-rzz*sz,zz=ry*sz+rzz*cz,f=Math.min(W,H)*1.05,scale=f/Math.max(9,zz+70);return{x:W/2+rx*scale,y:H*.54-yy*scale,scale}}
function line(x1,z1,x2,z2){let a=project(x1,z1),b=project(x2,z2);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function circle(x,z,r){let prev=null;for(let i=0;i<=40;i++){let a=i/40*Math.PI*2,q=project(x+Math.cos(a)*r,z+Math.sin(a)*r);if(prev){ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(q.x,q.y);ctx.stroke()}prev=q}}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H*.7);sky.addColorStop(0,'#87b8a1');sky.addColorStop(.65,'#d4dec3');sky.addColorStop(1,'#4b6b58');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.72);ctx.fillStyle='#263d31';ctx.fillRect(0,H*.62,W,H*.38);ctx.fillStyle='#16251e';ctx.fillRect(0,H*.62,W,H*.09);for(let x=0;x<W;x+=18){ctx.fillStyle=x%4?'#7c2f42':'#b12e50';ctx.fillRect(x,H*.625+(x%3)*2,8,3)}
let c1=project(-35,-22),c2=project(35,-22),c3=project(35,22),c4=project(-35,22);ctx.beginPath();ctx.moveTo(c1.x,c1.y);ctx.lineTo(c2.x,c2.y);ctx.lineTo(c3.x,c3.y);ctx.lineTo(c4.x,c4.y);ctx.closePath();ctx.fillStyle='#3f8a48';ctx.fill();ctx.strokeStyle='#e9f2d9cc';ctx.lineWidth=2;ctx.stroke();for(let i=-5;i<5;i++){let a=project(i*7,-22),b=project((i+1)*7,-22),cc=project((i+1)*7,22),d=project(i*7,22);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(cc.x,cc.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fillStyle=i%2?'#397f43':'#438d4b';ctx.fill()}ctx.strokeStyle='#e9f2d9cc';ctx.lineWidth=2;line(-35,-22,35,-22);line(35,-22,35,22);line(35,22,-35,22);line(-35,22,-35,-22);line(0,-22,0,22);circle(0,0,6);
for(let side of [-1,1]){let x=side*35;ctx.strokeStyle='#fff';ctx.lineWidth=2;line(x,-8,x,-8);line(x,8,x,8);line(side*38,-8,side*38,8);line(side*38,-8,x,-8);line(side*38,8,x,8)}
let objs=players.map(p=>({kind:'p',v:p}));objs.push({kind:'b',v:ball});objs.sort((a,b)=>b.v.z-a.v.z);for(let o of objs)o.kind==='b'?drawBall(o.v):drawPlayer(o.v)}
function drawPlayer(p){let q=project(p.x,p.z,0),s=Math.max(7,q.scale*.9);ctx.save();ctx.translate(q.x,q.y);if(p===players[controlled]){ctx.beginPath();ctx.ellipse(0,2,s*.9,5,0,0,Math.PI*2);ctx.strokeStyle='#dfff62';ctx.lineWidth=3;ctx.stroke()}ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,1,s*.7,3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.team?'#191b24':'#fff';ctx.fillRect(-s*.22,-s*1.8,s*.44,s*.9);ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(-s*.34,-s*1.35,s*.68,s*.95,3);ctx.fill();ctx.fillStyle='#c9906e';ctx.beginPath();ctx.arc(0,-s*1.65,s*.22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(7,s*.24)}px Arial`;ctx.textAlign='center';ctx.fillText(p.num,0,-s*.82);ctx.restore()}
function drawBall(b){let q=project(b.x,b.z,.55),s=Math.max(5,q.scale*.18);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(q.x,q.y+s*.25,s,s*.35,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5f3e8';ctx.beginPath();ctx.arc(q.x,q.y,s,0,Math.PI*2);ctx.fill();ctx.fillStyle='#20251f';ctx.beginPath();ctx.moveTo(q.x,q.y-s*.55);ctx.lineTo(q.x+s*.28,q.y-s*.18);ctx.lineTo(q.x+s*.1,q.y+s*.32);ctx.lineTo(q.x-s*.25,q.y+s*.18);ctx.lineTo(q.x-s*.38,q.y-s*.18);ctx.closePath();ctx.fill()}
window.keys={};addEventListener('keydown',e=>{let k=e.key.toLowerCase();window.keys[k]=true;if(k==='x')shoot();if(k==='c')passBall();if(k==='v')switchPlayer();if(k==='escape'){paused=!paused;document.getElementById('pause').classList.toggle('hidden',!paused)}});addEventListener('keyup',e=>window.keys[e.key.toLowerCase()]=false);document.getElementById('play').onclick=()=>{document.getElementById('start').classList.add('hidden');running=true;paused=false;last=performance.now()};document.getElementById('resume').onclick=()=>{paused=false;document.getElementById('pause').classList.add('hidden')};document.getElementById('btnShoot').onclick=shoot;document.getElementById('btnPass').onclick=passBall;document.getElementById('btnSwitch').onclick=switchPlayer;
let joy=document.getElementById('joystick'),stick=document.getElementById('stick'),joyId=null;joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});joy.addEventListener('pointerup',()=>{joyId=null;touchMove=null;stick.style.left='34px';stick.style.top='34px'});function moveJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),l=Math.hypot(x,y)||1,max=36;x=x/l*Math.min(l,max);y=y/l*Math.min(l,max);stick.style.left=(34+x)+'px';stick.style.top=(34+y)+'px';touchMove={x:x/max,y:y/max}}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}resetKickoff();requestAnimationFrame(loop);
</script></body></html>
